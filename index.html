<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Receipt Scanner</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#156552">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Receipts">

<style>
  :root{
    --bg:#f4f1ea;
    --card:#ffffff;
    --text:#20302a;
    --muted:#6b7a74;
    --primary:#156552;
    --primary-dark:#0f4d3e;
    --accent:#e67e22;
    --danger:#c0392b;
    --border:#e3ddd0;
    --shadow:0 1px 3px rgba(20,40,32,.08), 0 1px 2px rgba(20,40,32,.06);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  #app{
    max-width:560px;
    margin:0 auto;
    min-height:100%;
    padding-bottom:100px;
    padding-top:env(safe-area-inset-top);
  }
  header.topbar{
    position:sticky;
    top:0;
    z-index:20;
    background:var(--primary);
    color:#fff;
    padding:14px 16px calc(14px + env(safe-area-inset-top,0px)) 16px;
    margin-top:calc(-1 * env(safe-area-inset-top,0px));
    padding-top:calc(14px + env(safe-area-inset-top,0px));
    display:flex;
    align-items:center;
    gap:10px;
    box-shadow:var(--shadow);
  }
  header.topbar h1{
    font-size:19px;
    margin:0;
    font-weight:700;
    flex:1;
    line-height:1.2;
  }
  header.topbar .sub{
    font-size:12px;
    opacity:.85;
    font-weight:400;
    display:block;
  }
  .icon-btn{
    background:rgba(255,255,255,.16);
    border:none;
    color:#fff;
    width:36px;
    height:36px;
    border-radius:10px;
    font-size:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
  }
  .icon-btn:active{background:rgba(255,255,255,.3);}

  main{padding:16px;}

  .banner{
    background:#fff4e5;
    border:1px solid #f0c987;
    color:#7a4b06;
    padding:10px 12px;
    border-radius:10px;
    font-size:13px;
    margin-bottom:14px;
    line-height:1.4;
  }
  .banner code{background:rgba(0,0,0,.06);padding:1px 4px;border-radius:4px;}

  button{font-family:inherit;}
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    border:none;
    border-radius:12px;
    padding:12px 18px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    background:var(--card);
    color:var(--text);
    box-shadow:var(--shadow);
  }
  .btn:active{transform:scale(.98);}
  .btn:disabled{opacity:.55;cursor:default;}
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-accent{background:var(--accent);color:#fff;}
  .btn-outline{background:transparent;box-shadow:none;border:1.5px solid var(--border);color:var(--text);}
  .btn-danger{background:var(--danger);color:#fff;}
  .btn-block{width:100%;}
  .btn-sm{padding:8px 12px;font-size:13px;border-radius:9px;}

  .fab-wrap{
    position:fixed;
    left:0; right:0; bottom:0;
    display:flex;
    justify-content:center;
    padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px)) 16px;
    background:linear-gradient(to top, var(--bg) 60%, rgba(244,241,234,0));
    z-index:15;
  }
  .fab-wrap .btn{
    max-width:528px;
    width:100%;
    padding:15px 18px;
    font-size:16px;
    border-radius:14px;
  }

  .empty{
    text-align:center;
    color:var(--muted);
    padding:60px 20px;
    font-size:14px;
  }
  .empty .big{font-size:40px;display:block;margin-bottom:10px;}

  .month-card{
    background:var(--card);
    border-radius:14px;
    box-shadow:var(--shadow);
    padding:14px 14px;
    margin-bottom:12px;
    display:flex;
    align-items:center;
    gap:12px;
    cursor:pointer;
  }
  .month-card:active{background:#fbfaf6;}
  .month-card .info{flex:1; min-width:0;}
  .month-card .name{font-weight:700; font-size:16px;}
  .month-card .count{color:var(--muted); font-size:13px; margin-top:2px;}
  .month-card .actions{flex-shrink:0;}

  .grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
  }
  .thumb{
    position:relative;
    aspect-ratio:3/4;
    border-radius:10px;
    overflow:hidden;
    background:#e9e4d6;
    box-shadow:var(--shadow);
  }
  .thumb img{
    width:100%; height:100%; object-fit:cover; display:block;
    cursor:pointer;
  }
  .thumb .del{
    position:absolute;
    top:5px; right:5px;
    width:26px; height:26px;
    border-radius:50%;
    background:rgba(20,20,20,.55);
    color:#fff;
    border:none;
    font-size:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    line-height:1;
  }
  .thumb .del:active{background:var(--danger);}
  .thumb .badge{
    position:absolute;
    bottom:4px; left:4px;
    background:rgba(20,20,20,.55);
    color:#fff;
    font-size:10px;
    padding:2px 6px;
    border-radius:6px;
  }

  .section-title{
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:.04em;
    color:var(--muted);
    font-weight:700;
    margin:4px 0 10px;
  }

  .bottom-bar{
    position:fixed;
    left:0; right:0; bottom:0;
    z-index:15;
    background:var(--card);
    border-top:1px solid var(--border);
    padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px)) 16px;
    display:flex;
    gap:10px;
  }
  .bottom-bar .btn{flex:1;}

  .spinner{
    width:16px; height:16px;
    border:2.5px solid rgba(255,255,255,.4);
    border-top-color:#fff;
    border-radius:50%;
    animation:spin .7s linear infinite;
    display:inline-block;
  }
  .spinner.dark{
    border:2.5px solid rgba(21,101,82,.25);
    border-top-color:var(--primary);
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .center-loading{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    color:var(--muted);
    padding:50px 0;
    font-size:14px;
  }

  #toast{
    position:fixed;
    left:50%;
    bottom:calc(90px + env(safe-area-inset-bottom,0px));
    transform:translate(-50%, 20px);
    background:#22312b;
    color:#fff;
    padding:10px 16px;
    border-radius:10px;
    font-size:13px;
    max-width:88%;
    text-align:center;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    z-index:50;
    box-shadow:0 6px 18px rgba(0,0,0,.25);
  }
  #toast.show{
    opacity:1;
    transform:translate(-50%, 0);
  }

  #lightbox{
    position:fixed;
    inset:0;
    background:rgba(10,15,12,.92);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:60;
    padding:20px;
  }
  #lightbox.show{display:flex;}
  #lightbox img{max-width:100%; max-height:100%; border-radius:8px;}
  #lightbox .close{
    position:absolute;
    top:calc(16px + env(safe-area-inset-top,0px));
    right:16px;
    width:38px; height:38px;
    border-radius:50%;
    background:rgba(255,255,255,.15);
    color:#fff;
    border:none;
    font-size:18px;
    cursor:pointer;
  }

  .hint{color:var(--muted); font-size:13px; margin:0 0 16px; line-height:1.5;}

  #cropOverlay{
    position:fixed;
    inset:0;
    background:#0b0f0d;
    display:none;
    flex-direction:column;
    z-index:70;
  }
  #cropOverlay.show{display:flex;}
  .crop-header{
    display:flex;
    align-items:center;
    gap:10px;
    padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px 16px;
    color:#fff;
    flex-shrink:0;
  }
  .crop-header .title{flex:1; font-weight:700; font-size:16px;}
  .crop-header .title .sub{display:block; font-size:12px; font-weight:400; opacity:.75; margin-top:1px;}
  .crop-stage{
    position:relative;
    flex:1;
    min-height:0;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    touch-action:none;
  }
  .crop-canvas{
    max-width:100%;
    max-height:100%;
    display:block;
    touch-action:none;
    -webkit-user-select:none;
    user-select:none;
  }
  .crop-svg{
    position:absolute;
    left:0; top:0;
    pointer-events:none;
  }
  .crop-poly{
    fill:rgba(21,101,82,.28);
    stroke:#fff;
    stroke-width:2;
  }
  .crop-handle{
    position:absolute;
    left:0; top:0;
    width:34px; height:34px;
    margin-left:-17px;
    margin-top:-17px;
    border-radius:50%;
    background:rgba(255,255,255,.96);
    border:3px solid var(--primary);
    box-shadow:0 2px 8px rgba(0,0,0,.45);
    touch-action:none;
    cursor:grab;
    z-index:2;
  }
  .crop-actions{
    display:flex;
    gap:10px;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px)) 16px;
    background:#12211c;
    flex-shrink:0;
  }
  .crop-actions .btn{flex:1;}
  .crop-hint{
    color:rgba(255,255,255,.7);
    font-size:12.5px;
    text-align:center;
    padding:0 16px 10px;
    flex-shrink:0;
  }
</style>
</head>
<body>

<div id="app"></div>
<div id="toast"></div>
<div id="lightbox"><button class="close" id="lightboxClose">&#10005;</button><img id="lightboxImg" alt="Receipt full size"></div>

<!-- capture="environment" forces the rear camera open directly on every phone we've
     tested, including Samsung (where a plain <input> with no capture attribute was
     found to sometimes open the FRONT camera instead of a chooser). Since we can't
     reach any OS-level document scanner reliably this way, cropping/deskewing the
     receipt is done ourselves after the photo is taken - see the crop screen below. -->
<input type="file" id="takePhotoInput" accept="image/*" capture="environment" multiple style="display:none">

<!-- Crop screen: shown after each photo is taken, before it's added to the review
     batch. Lets the user drag the 4 corner handles onto the receipt's edges; the
     quad is then perspective-warped into a straightened rectangle client-side. -->
<div id="cropOverlay">
  <div class="crop-header">
    <button class="icon-btn" id="cropCancelBtn" aria-label="Discard this photo">&#10005;</button>
    <div class="title">Crop Receipt<span class="sub" id="cropSub"></span></div>
  </div>
  <div class="crop-stage" id="cropStage">
    <svg class="crop-svg" id="cropSvg"><polygon class="crop-poly" id="cropPoly"></polygon></svg>
    <div class="crop-handle" id="cropHandle0"></div>
    <div class="crop-handle" id="cropHandle1"></div>
    <div class="crop-handle" id="cropHandle2"></div>
    <div class="crop-handle" id="cropHandle3"></div>
  </div>
  <div class="crop-hint">Drag the corners onto the edges of the receipt</div>
  <div class="crop-actions">
    <button class="btn btn-outline" id="cropResetBtn">Reset</button>
    <button class="btn btn-primary" id="cropConfirmBtn">Use Photo</button>
  </div>
</div>

<!-- Firebase (compat build - simplest to use from a single static HTML file, no bundler) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<!-- pdf-lib for compiling a month's receipts into one downloadable PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

<script src="firebase-config.js"></script>
<script>
(function(){
  "use strict";

  // ---------------------------------------------------------------------
  // Firebase setup
  // ---------------------------------------------------------------------
  var cfg = window.RECEIPT_APP_FIREBASE_CONFIG || {};
  var CONFIGURED = !!cfg.apiKey && cfg.apiKey.indexOf("REPLACE_WITH") !== 0;
  var db = null, storage = null;

  if (CONFIGURED) {
    try {
      firebase.initializeApp(cfg);
      db = firebase.firestore();
      storage = firebase.storage();
    } catch (e) {
      console.error("Firebase init failed", e);
      CONFIGURED = false;
    }
  }

  // ---------------------------------------------------------------------
  // State
  // ---------------------------------------------------------------------
  var state = {
    pendingBatch: [],   // [{id, blob, previewUrl, capturedAt, width, height}]
    monthsCache: null,  // [{monthKey, label, count}]
    saving: false,
    cropQueue: [],       // photos captured but not yet cropped/confirmed: [{id, canvas, width, height, capturedAt}]
    cropTotal: 0,        // size of the batch cropQueue started with, for the "Photo X of N" label
    cropCurrent: null,   // the cropQueue[0] item currently shown on the crop screen
    cropPoints: null     // current handle positions, normalized [0,1] x [0,1]: [TL, TR, BR, BL]
  };

  // ---------------------------------------------------------------------
  // Helpers
  // ---------------------------------------------------------------------
  function $(sel, root){ return (root || document).querySelector(sel); }
  function el(tag, attrs, children){
    var node = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function(k){
      var v = attrs[k];
      if (v == null || v === false) return;
      if (k === "class") node.className = v;
      else if (k === "html") node.innerHTML = v;
      else if (k.indexOf("on") === 0 && typeof v === "function") node.addEventListener(k.slice(2), v);
      else node.setAttribute(k, v);
    });
    (children || []).forEach(function(c){
      if (c == null) return;
      node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return node;
  }
  function pad2(n){ return n < 10 ? "0" + n : "" + n; }
  function monthKeyFromDate(d){ return d.getFullYear() + "-" + pad2(d.getMonth() + 1); }
  function monthLabelFromKey(key){
    var parts = key.split("-");
    var d = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, 1);
    return d.toLocaleDateString(undefined, { month: "long", year: "numeric" });
  }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

  var toastTimer = null;
  function showToast(msg){
    var t = $("#toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 3200);
  }

  function openLightbox(url){
    $("#lightboxImg").src = url;
    $("#lightbox").classList.add("show");
  }
  function closeLightbox(){
    $("#lightbox").classList.remove("show");
    $("#lightboxImg").src = "";
  }
  $("#lightboxClose").addEventListener("click", closeLightbox);
  $("#lightbox").addEventListener("click", function(e){ if (e.target.id === "lightbox") closeLightbox(); });

  // ---------------------------------------------------------------------
  // Image processing: downscale + normalize to JPEG before upload
  // ---------------------------------------------------------------------
  function loadImageSource(file){
    if (window.createImageBitmap) {
      return createImageBitmap(file, { imageOrientation: "from-image" }).catch(function(){
        return createImageBitmap(file);
      });
    }
    return new Promise(function(resolve, reject){
      var img = new Image();
      img.onload = function(){ resolve(img); };
      img.onerror = reject;
      img.src = URL.createObjectURL(file);
    });
  }

  // Downscales to a canvas only - deliberately does NOT encode to JPEG yet, since
  // the crop screen needs real pixels to warp. Encoding happens once, after crop,
  // in canvasToBlob().
  function loadDownscaledCanvas(file){
    return loadImageSource(file).then(function(src){
      var maxDim = 1800;
      var width = src.width, height = src.height;
      var scale = Math.min(1, maxDim / Math.max(width, height));
      var w = Math.max(1, Math.round(width * scale));
      var h = Math.max(1, Math.round(height * scale));
      var canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      var ctx = canvas.getContext("2d");
      ctx.drawImage(src, 0, 0, w, h);
      if (src.close) src.close();
      return { canvas: canvas, width: w, height: h };
    });
  }

  function canvasToBlob(canvas, type, quality){
    return new Promise(function(resolve, reject){
      canvas.toBlob(function(blob){
        if (!blob) return reject(new Error("Could not encode image"));
        resolve(blob);
      }, type, quality);
    });
  }

  // ---------------------------------------------------------------------
  // Photo input handling
  //
  // Single <input capture="environment">: forces the rear camera open
  // directly on every phone we've tested, with no regressions. A plain
  // <input> with no capture attribute was tried instead (to reach Samsung's
  // built-in "Scan documents" option through the OS chooser) but on Samsung
  // it sometimes opened the FRONT camera instead - worse than what we had.
  // Since no OS-level document scanner can be reached reliably this way,
  // cropping/deskewing the receipt is handled ourselves, in-app, right
  // after the photo is taken (see the crop-screen section below).
  // ---------------------------------------------------------------------
  var takePhotoInput = $("#takePhotoInput");

  takePhotoInput.addEventListener("change", function(){
    var files = Array.prototype.slice.call(takePhotoInput.files || []);
    takePhotoInput.value = ""; // allow re-selecting/retaking later
    if (!files.length) return;
    var capturedAt = new Date();
    Promise.all(files.map(function(file){
      return loadDownscaledCanvas(file).then(function(res){
        return { id: uid(), canvas: res.canvas, width: res.width, height: res.height, capturedAt: capturedAt };
      }).catch(function(err){
        console.error(err);
        showToast("Skipped a photo that couldn't be read.");
        return null;
      });
    })).then(function(items){
      items = items.filter(Boolean);
      if (items.length) startCropQueue(items);
    });
  });

  function openTakePhoto(){
    if (!CONFIGURED) { showToast("Set up Firebase first — see README.md"); return; }
    takePhotoInput.click();
  }

  // ---------------------------------------------------------------------
  // Crop screen
  //
  // Shown once per captured photo, before it joins the review batch. Four
  // draggable corner handles (order: TL, TR, BR, BL) let the user mark the
  // receipt's actual edges; "Use Photo" then perspective-warps just that
  // quad into a straightened rectangle, entirely client-side (a mesh of
  // small quads, each rendered as two textured triangles via Canvas2D's
  // affine `transform()` - no WebGL, no external library, works the same
  // on iOS Safari and Android Chrome).
  // ---------------------------------------------------------------------
  var cropOverlay = $("#cropOverlay");
  var cropStage = $("#cropStage");
  var cropSvg = $("#cropSvg");
  var cropPoly = $("#cropPoly");
  var cropSub = $("#cropSub");
  var cropHandleEls = [$("#cropHandle0"), $("#cropHandle1"), $("#cropHandle2"), $("#cropHandle3")];

  var DEFAULT_CROP_POINTS = [
    { x: 0.06, y: 0.06 }, // top-left
    { x: 0.94, y: 0.06 }, // top-right
    { x: 0.94, y: 0.94 }, // bottom-right
    { x: 0.06, y: 0.94 }  // bottom-left
  ];

  function clamp01(v){ return Math.max(0, Math.min(1, v)); }
  function cloneCropDefaults(){ return DEFAULT_CROP_POINTS.map(function(p){ return { x: p.x, y: p.y }; }); }

  function startCropQueue(items){
    state.cropQueue = state.cropQueue.concat(items);
    state.cropTotal = state.cropQueue.length;
    showNextCropItem();
  }

  function showNextCropItem(){
    if (!state.cropQueue.length){
      cropOverlay.classList.remove("show");
      state.cropCurrent = null;
      state.cropTotal = 0;
      if (state.pendingBatch.length) { location.hash = "#/review"; render(); }
      return;
    }
    var item = state.cropQueue[0];
    state.cropCurrent = item;
    state.cropPoints = cloneCropDefaults();

    var existing = cropStage.querySelector("canvas.crop-canvas");
    if (existing) existing.remove();
    item.canvas.className = "crop-canvas";
    cropStage.insertBefore(item.canvas, cropStage.firstChild);

    var idx = state.cropTotal - state.cropQueue.length + 1;
    cropSub.textContent = state.cropTotal > 1 ? ("Photo " + idx + " of " + state.cropTotal) : "";

    cropOverlay.classList.add("show");
    // Wait a frame so the canvas has been laid out (its displayed size is what
    // handle positions are computed from) before placing the handles.
    requestAnimationFrame(function(){ requestAnimationFrame(layoutCropHandles); });
  }

  function layoutCropHandles(){
    if (!state.cropCurrent) return;
    var canvasEl = cropStage.querySelector("canvas.crop-canvas");
    if (!canvasEl) return;
    var stageRect = cropStage.getBoundingClientRect();
    var rect = canvasEl.getBoundingClientRect();
    var offsetX = rect.left - stageRect.left;
    var offsetY = rect.top - stageRect.top;

    var pts = state.cropPoints.map(function(p){
      return { x: offsetX + p.x * rect.width, y: offsetY + p.y * rect.height };
    });

    cropHandleEls.forEach(function(h, i){
      h.style.left = pts[i].x + "px";
      h.style.top = pts[i].y + "px";
    });

    cropSvg.setAttribute("width", stageRect.width);
    cropSvg.setAttribute("height", stageRect.height);
    cropSvg.setAttribute("viewBox", "0 0 " + stageRect.width + " " + stageRect.height);
    cropPoly.setAttribute("points", pts.map(function(p){ return p.x + "," + p.y; }).join(" "));
  }

  cropHandleEls.forEach(function(handle, index){
    handle.addEventListener("pointerdown", function(ev){
      ev.preventDefault();
      handle.setPointerCapture(ev.pointerId);

      function move(ev2){
        var canvasEl = cropStage.querySelector("canvas.crop-canvas");
        if (!canvasEl) return;
        var rect = canvasEl.getBoundingClientRect();
        if (!rect.width || !rect.height) return;
        state.cropPoints[index] = {
          x: clamp01((ev2.clientX - rect.left) / rect.width),
          y: clamp01((ev2.clientY - rect.top) / rect.height)
        };
        layoutCropHandles();
      }
      function up(ev2){
        try { handle.releasePointerCapture(ev2.pointerId); } catch (e) {}
        handle.removeEventListener("pointermove", move);
        handle.removeEventListener("pointerup", up);
        handle.removeEventListener("pointercancel", up);
      }
      handle.addEventListener("pointermove", move);
      handle.addEventListener("pointerup", up);
      handle.addEventListener("pointercancel", up);
    });
  });

  window.addEventListener("resize", function(){
    if (cropOverlay.classList.contains("show")) layoutCropHandles();
  });

  $("#cropResetBtn").addEventListener("click", function(){
    state.cropPoints = cloneCropDefaults();
    layoutCropHandles();
  });

  $("#cropCancelBtn").addEventListener("click", function(){
    if (!state.cropQueue.length) { cropOverlay.classList.remove("show"); return; }
    state.cropQueue.shift();
    showNextCropItem();
  });

  $("#cropConfirmBtn").addEventListener("click", function(){
    var item = state.cropCurrent;
    if (!item) return;
    var srcPts = state.cropPoints.map(function(p){
      return { x: p.x * item.width, y: p.y * item.height };
    });
    var result = warpQuadToCanvas(item.canvas, srcPts);
    canvasToBlob(result.canvas, "image/jpeg", 0.85).then(function(blob){
      state.pendingBatch.push({
        id: item.id,
        blob: blob,
        previewUrl: URL.createObjectURL(blob),
        capturedAt: item.capturedAt,
        width: result.width,
        height: result.height
      });
      state.cropQueue.shift();
      showNextCropItem();
    }).catch(function(err){
      console.error(err);
      showToast("Couldn't process that crop — try again.");
    });
  });

  function distance(p, q){ var dx = p.x - q.x, dy = p.y - q.y; return Math.sqrt(dx * dx + dy * dy); }

  // True projective ("square-to-quadrilateral") mapping: returns a function
  // that takes a (u,v) in [0,1]x[0,1] - a position in the straightened output
  // - and maps it to the corresponding point inside the source quad [TL, TR,
  // BR, BL]. This is the standard closed-form homography used for document/
  // barcode perspective correction (the same derivation ZXing's
  // PerspectiveTransform.squareToQuadrilateral uses), so straight edges in
  // the source (the receipt's sides) stay straight in the output - a plain
  // bilinear blend of the 4 corners would bow lines near strong perspective.
  function squareToQuadMapper(quad){
    var x0 = quad[0].x, y0 = quad[0].y, x1 = quad[1].x, y1 = quad[1].y;
    var x2 = quad[2].x, y2 = quad[2].y, x3 = quad[3].x, y3 = quad[3].y;
    var dx3 = x0 - x1 + x2 - x3, dy3 = y0 - y1 + y2 - y3;
    var a11, a21, a12, a22, g, h;
    if (Math.abs(dx3) < 1e-9 && Math.abs(dy3) < 1e-9) {
      // Already a parallelogram - plain affine map, no perspective term needed.
      a11 = x1 - x0; a21 = x2 - x1;
      a12 = y1 - y0; a22 = y2 - y1;
      g = 0; h = 0;
    } else {
      var dx1 = x1 - x2, dx2 = x3 - x2, dy1 = y1 - y2, dy2 = y3 - y2;
      var denom = dx1 * dy2 - dx2 * dy1;
      g = (dx3 * dy2 - dx2 * dy3) / denom;
      h = (dx1 * dy3 - dx3 * dy1) / denom;
      a11 = x1 - x0 + g * x1; a21 = x3 - x0 + h * x3;
      a12 = y1 - y0 + g * y1; a22 = y3 - y0 + h * y3;
    }
    return function(u, v){
      var w = g * u + h * v + 1;
      return { x: (a11 * u + a21 * v + x0) / w, y: (a12 * u + a22 * v + y0) / w };
    };
  }

  // Draws the triangle of `img` at source points srcPts onto `ctx` at
  // destination points dstPts, via the unique affine transform mapping one
  // triangle onto the other (solved with Cramer's rule) plus a clip path.
  function warpTriangle(ctx, img, srcPts, dstPts){
    var x0 = srcPts[0].x, y0 = srcPts[0].y, x1 = srcPts[1].x, y1 = srcPts[1].y, x2 = srcPts[2].x, y2 = srcPts[2].y;
    var X0 = dstPts[0].x, Y0 = dstPts[0].y, X1 = dstPts[1].x, Y1 = dstPts[1].y, X2 = dstPts[2].x, Y2 = dstPts[2].y;

    var denom = x0 * (y1 - y2) + x1 * (y2 - y0) + x2 * (y0 - y1);
    if (Math.abs(denom) < 1e-6) return;

    var a = (X0 * (y1 - y2) + X1 * (y2 - y0) + X2 * (y0 - y1)) / denom;
    var b = (Y0 * (y1 - y2) + Y1 * (y2 - y0) + Y2 * (y0 - y1)) / denom;
    var c = (X0 * (x2 - x1) + X1 * (x0 - x2) + X2 * (x1 - x0)) / denom;
    var d = (Y0 * (x2 - x1) + Y1 * (x0 - x2) + Y2 * (x1 - x0)) / denom;
    var e = (X0 * (x1 * y2 - x2 * y1) + X1 * (x2 * y0 - x0 * y2) + X2 * (x0 * y1 - x1 * y0)) / denom;
    var f = (Y0 * (x1 * y2 - x2 * y1) + Y1 * (x2 * y0 - x0 * y2) + Y2 * (x0 * y1 - x1 * y0)) / denom;

    var sMinX = Math.max(0, Math.floor(Math.min(x0, x1, x2)));
    var sMinY = Math.max(0, Math.floor(Math.min(y0, y1, y2)));
    var sMaxX = Math.min(img.width, Math.ceil(Math.max(x0, x1, x2)));
    var sMaxY = Math.min(img.height, Math.ceil(Math.max(y0, y1, y2)));
    var sw = sMaxX - sMinX, sh = sMaxY - sMinY;
    if (sw <= 0 || sh <= 0) return;

    ctx.save();
    ctx.beginPath();
    ctx.moveTo(X0, Y0); ctx.lineTo(X1, Y1); ctx.lineTo(X2, Y2); ctx.closePath();
    ctx.clip();
    ctx.transform(a, b, c, d, e, f);
    ctx.drawImage(img, sMinX, sMinY, sw, sh, sMinX, sMinY, sw, sh);
    ctx.restore();
  }

  // srcPts: [TL, TR, BR, BL] in sourceCanvas pixel coordinates.
  function warpQuadToCanvas(sourceCanvas, srcPts){
    var TL = srcPts[0], TR = srcPts[1], BR = srcPts[2], BL = srcPts[3];

    var outW = Math.round((distance(TL, TR) + distance(BL, BR)) / 2);
    var outH = Math.round((distance(TL, BL) + distance(TR, BR)) / 2);
    outW = Math.max(40, outW);
    outH = Math.max(40, outH);
    var maxDim = 1800;
    var scale = Math.min(1, maxDim / Math.max(outW, outH));
    outW = Math.round(outW * scale);
    outH = Math.round(outH * scale);

    var out = document.createElement("canvas");
    out.width = outW; out.height = outH;
    var ctx = out.getContext("2d");
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, outW, outH);

    var cols = Math.max(6, Math.min(24, Math.round(outW / 70)));
    var rows = Math.max(6, Math.min(30, Math.round(outH / 70)));
    var mapFn = squareToQuadMapper([TL, TR, BR, BL]);

    for (var j = 0; j < rows; j++){
      var v0 = j / rows, v1 = (j + 1) / rows;
      for (var i = 0; i < cols; i++){
        var u0 = i / cols, u1 = (i + 1) / cols;

        var sTL = mapFn(u0, v0);
        var sTR = mapFn(u1, v0);
        var sBR = mapFn(u1, v1);
        var sBL = mapFn(u0, v1);

        var dTL = { x: u0 * outW, y: v0 * outH };
        var dTR = { x: u1 * outW, y: v0 * outH };
        var dBR = { x: u1 * outW, y: v1 * outH };
        var dBL = { x: u0 * outW, y: v1 * outH };

        warpTriangle(ctx, sourceCanvas, [sTL, sTR, sBR], [dTL, dTR, dBR]);
        warpTriangle(ctx, sourceCanvas, [sTL, sBR, sBL], [dTL, dBR, dBL]);
      }
    }

    return { canvas: out, width: outW, height: outH };
  }

  function removeFromBatch(id){
    var item = state.pendingBatch.find(function(i){ return i.id === id; });
    if (item) URL.revokeObjectURL(item.previewUrl);
    state.pendingBatch = state.pendingBatch.filter(function(i){ return i.id !== id; });
    render();
  }

  function discardBatch(){
    if (!state.pendingBatch.length) { location.hash = "#/home"; return; }
    if (!confirm("Discard all " + state.pendingBatch.length + " photo(s) in this batch?")) return;
    state.pendingBatch.forEach(function(i){ URL.revokeObjectURL(i.previewUrl); });
    state.pendingBatch = [];
    location.hash = "#/home";
  }

  function saveBatch(){
    if (!state.pendingBatch.length || state.saving) return;
    state.saving = true;
    render();

    var items = state.pendingBatch.slice();
    var lastMonthKey = null;

    var chain = items.reduce(function(p, item){
      return p.then(function(){
        var monthKey = monthKeyFromDate(item.capturedAt);
        lastMonthKey = monthKey;
        var docId = db.collection("receipts").doc().id;
        var storagePath = "receipts/" + monthKey + "/" + docId + ".jpg";
        var ref = storage.ref().child(storagePath);
        return ref.put(item.blob, { contentType: "image/jpeg" })
          .then(function(){ return ref.getDownloadURL(); })
          .then(function(url){
            return db.collection("receipts").doc(docId).set({
              monthKey: monthKey,
              scanDate: item.capturedAt.toISOString(),
              createdAt: firebase.firestore.FieldValue.serverTimestamp(),
              imageUrl: url,
              storagePath: storagePath,
              width: item.width,
              height: item.height
            });
          });
      });
    }, Promise.resolve());

    chain.then(function(){
      state.pendingBatch.forEach(function(i){ URL.revokeObjectURL(i.previewUrl); });
      state.pendingBatch = [];
      state.monthsCache = null;
      showToast("Saved " + items.length + " receipt" + (items.length === 1 ? "" : "s") + ".");
      location.hash = lastMonthKey ? "#/month/" + lastMonthKey : "#/home";
    }).catch(function(err){
      console.error(err);
      showToast("Upload failed: " + (err && err.message ? err.message : "unknown error"));
    }).finally(function(){
      state.saving = false;
      render();
    });
  }

  // ---------------------------------------------------------------------
  // Firestore data access
  // ---------------------------------------------------------------------
  function fetchMonths(){
    return db.collection("receipts").get().then(function(snap){
      var counts = {};
      snap.forEach(function(doc){
        var d = doc.data();
        counts[d.monthKey] = (counts[d.monthKey] || 0) + 1;
      });
      var months = Object.keys(counts).map(function(key){
        return { monthKey: key, label: monthLabelFromKey(key), count: counts[key] };
      });
      months.sort(function(a, b){ return b.monthKey.localeCompare(a.monthKey); });
      return months;
    });
  }

  function fetchMonthReceipts(monthKey){
    return db.collection("receipts").where("monthKey", "==", monthKey).get().then(function(snap){
      var list = [];
      snap.forEach(function(doc){ list.push(Object.assign({ id: doc.id }, doc.data())); });
      list.sort(function(a, b){ return (a.scanDate || "").localeCompare(b.scanDate || ""); });
      return list;
    });
  }

  function deleteReceipt(receipt){
    return storage.ref().child(receipt.storagePath).delete().catch(function(err){
      console.warn("Storage file already gone or failed to delete", err);
    }).then(function(){
      return db.collection("receipts").doc(receipt.id).delete();
    });
  }

  // ---------------------------------------------------------------------
  // PDF export
  // ---------------------------------------------------------------------
  function buildPdf(receipts){
    return PDFLib.PDFDocument.create().then(function(pdfDoc){
      var chain = Promise.resolve();
      receipts.forEach(function(r){
        chain = chain.then(function(){
          return fetch(r.imageUrl).then(function(res){
            if (!res.ok) throw new Error("Could not download image (HTTP " + res.status + ")");
            return res.arrayBuffer();
          }).then(function(bytes){
            return pdfDoc.embedJpg(bytes);
          }).then(function(image){
            var page = pdfDoc.addPage([image.width, image.height]);
            page.drawImage(image, { x: 0, y: 0, width: image.width, height: image.height });
          });
        });
      });
      return chain.then(function(){ return pdfDoc.save(); });
    });
  }

  function downloadBlob(blob, filename){
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 5000);
  }

  function downloadMonthPdf(monthKey, btn){
    var originalHtml = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Building PDF…';
    fetchMonthReceipts(monthKey).then(function(receipts){
      if (!receipts.length) { showToast("No receipts in this month yet."); return Promise.resolve(); }
      return buildPdf(receipts).then(function(bytes){
        var blob = new Blob([bytes], { type: "application/pdf" });
        downloadBlob(blob, "Receipts-" + monthKey + ".pdf");
        showToast("PDF downloaded (" + receipts.length + " page" + (receipts.length === 1 ? "" : "s") + ").");
      });
    }).catch(function(err){
      console.error(err);
      showToast("Couldn't build PDF: " + (err && err.message ? err.message : "unknown error"));
    }).finally(function(){
      btn.disabled = false;
      btn.innerHTML = originalHtml;
    });
  }

  // ---------------------------------------------------------------------
  // Views
  // ---------------------------------------------------------------------
  function topbar(title, sub, opts){
    opts = opts || {};
    var kids = [];
    if (opts.back) {
      kids.push(el("button", { class: "icon-btn", "aria-label": "Back", onclick: function(){ location.hash = "#/home"; } }, ["‹"]));
    }
    var titleWrap = el("div", {}, [
      el("h1", {}, [title, sub ? el("span", { class: "sub" }, [sub]) : null])
    ]);
    kids.push(titleWrap);
    return el("header", { class: "topbar" }, kids);
  }

  function renderHome(root){
    root.appendChild(topbar("Receipt Scanner"));
    var main = el("main", {});
    root.appendChild(main);

    if (!CONFIGURED) {
      main.appendChild(el("div", { class: "banner" }, [
        "⚠️ Firebase isn't configured yet. Open ",
        el("code", {}, ["firebase-config.js"]),
        " and follow the setup steps in ",
        el("code", {}, ["README.md"]),
        " to connect your own Firebase project before scanning."
      ]));
    }

    main.appendChild(el("p", { class: "hint" }, ["Scan paper receipts with your camera. They're grouped automatically by the month you scanned them, ready to review, delete, or export as a PDF."]));

    var listWrap = el("div", { id: "monthList" }, [
      CONFIGURED
        ? el("div", { class: "center-loading" }, [el("span", { class: "spinner dark" }), "Loading months…"])
        : el("div", { class: "empty" }, [
            el("span", { class: "big" }, ["🧾"]),
            "Once Firebase is connected, your scanned receipts will show up here, grouped by month."
          ])
    ]);
    main.appendChild(listWrap);

    root.appendChild(el("div", { class: "fab-wrap" }, [
      el("button", { class: "btn btn-primary btn-block", onclick: openTakePhoto }, ["📷  Scan Receipt"])
    ]));

    if (!CONFIGURED) return;

    var render_ = function(months){
      listWrap.innerHTML = "";
      if (!months.length) {
        listWrap.appendChild(el("div", { class: "empty" }, [
          el("span", { class: "big" }, ["🧾"]),
          "No receipts yet. Tap “Scan Receipt” to add your first one."
        ]));
        return;
      }
      months.forEach(function(m){
        var dlBtn = el("button", { class: "btn btn-outline btn-sm", onclick: function(e){ e.stopPropagation(); downloadMonthPdf(m.monthKey, dlBtn); } }, ["⬇︎ PDF"]);
        var card = el("div", { class: "month-card", onclick: function(){ location.hash = "#/month/" + m.monthKey; } }, [
          el("div", { class: "info" }, [
            el("div", { class: "name" }, [m.label]),
            el("div", { class: "count" }, [m.count + " receipt" + (m.count === 1 ? "" : "s")])
          ]),
          el("div", { class: "actions" }, [dlBtn])
        ]);
        listWrap.appendChild(card);
      });
    };

    if (state.monthsCache) {
      render_(state.monthsCache);
    } else {
      fetchMonths().then(function(months){
        state.monthsCache = months;
        render_(months);
      }).catch(function(err){
        console.error(err);
        listWrap.innerHTML = "";
        listWrap.appendChild(el("div", { class: "empty" }, ["Couldn't load receipts: " + err.message]));
      });
    }
  }

  function renderReview(root){
    if (!state.pendingBatch.length) { location.hash = "#/home"; return; }

    root.appendChild(topbar("Review Scans", state.pendingBatch.length + " photo" + (state.pendingBatch.length === 1 ? "" : "s"), { back: true }));
    var main = el("main", {});
    root.appendChild(main);
    main.appendChild(el("p", { class: "hint" }, ["Remove any blurry or duplicate shots, then save. Removed photos are discarded — nothing is uploaded until you tap Save."]));

    var grid = el("div", { class: "grid" });
    state.pendingBatch.forEach(function(item){
      grid.appendChild(el("div", { class: "thumb" }, [
        el("img", { src: item.previewUrl, alt: "Pending receipt scan", onclick: function(){ openLightbox(item.previewUrl); } }),
        el("button", { class: "del", "aria-label": "Remove photo", onclick: function(){ removeFromBatch(item.id); } }, ["✕"])
      ]));
    });
    main.appendChild(grid);

    root.appendChild(el("div", { class: "bottom-bar" }, [
      el("button", { class: "btn btn-outline", disabled: state.saving, onclick: discardBatch }, ["Discard"]),
      el("button", { class: "btn btn-outline", disabled: state.saving, onclick: openTakePhoto }, ["+ Add Photo"]),
      el("button", {
        class: "btn btn-primary",
        disabled: state.saving,
        onclick: saveBatch
      }, state.saving
          ? [el("span", { class: "spinner" }), " Saving…"]
          : ["Save (" + state.pendingBatch.length + ")"])
    ]));
  }

  function renderMonth(root, monthKey){
    root.appendChild(topbar(monthLabelFromKey(monthKey), null, { back: true }));
    var main = el("main", {});
    root.appendChild(main);

    var toolbar = el("div", { style: "display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;" });
    var countLabel = el("div", { class: "hint", style: "margin:0;" }, ["Loading…"]);
    var pdfBtn = el("button", { class: "btn btn-accent btn-sm", onclick: function(){ downloadMonthPdf(monthKey, pdfBtn); } }, ["⬇︎ Download PDF"]);
    toolbar.appendChild(countLabel);
    toolbar.appendChild(pdfBtn);
    main.appendChild(toolbar);

    var listWrap = el("div", {}, [
      el("div", { class: "center-loading" }, [el("span", { class: "spinner dark" }), "Loading receipts…"])
    ]);
    main.appendChild(listWrap);

    fetchMonthReceipts(monthKey).then(function(receipts){
      countLabel.textContent = receipts.length + " receipt" + (receipts.length === 1 ? "" : "s");
      listWrap.innerHTML = "";
      if (!receipts.length) {
        listWrap.appendChild(el("div", { class: "empty" }, ["No receipts left in this month."]));
        return;
      }
      var grid = el("div", { class: "grid" });
      receipts.forEach(function(r){
        var thumb = el("div", { class: "thumb" }, [
          el("img", { src: r.imageUrl, alt: "Receipt", loading: "lazy", onclick: function(){ openLightbox(r.imageUrl); } }),
          el("button", { class: "del", "aria-label": "Delete receipt", onclick: function(){ confirmDeleteReceipt(r, monthKey, thumb, countLabel); } }, ["🗑"])
        ]);
        grid.appendChild(thumb);
      });
      listWrap.appendChild(grid);
    }).catch(function(err){
      console.error(err);
      listWrap.innerHTML = "";
      listWrap.appendChild(el("div", { class: "empty" }, ["Couldn't load receipts: " + err.message]));
    });
  }

  function confirmDeleteReceipt(receipt, monthKey, thumbNode, countLabel){
    if (!confirm("Delete this receipt? This can't be undone.")) return;
    thumbNode.style.opacity = "0.4";
    deleteReceipt(receipt).then(function(){
      thumbNode.remove();
      state.monthsCache = null;
      var remaining = $(".grid") ? $(".grid").children.length : 0;
      countLabel.textContent = remaining + " receipt" + (remaining === 1 ? "" : "s");
      showToast("Receipt deleted.");
    }).catch(function(err){
      console.error(err);
      thumbNode.style.opacity = "1";
      showToast("Couldn't delete: " + (err && err.message ? err.message : "unknown error"));
    });
  }

  // ---------------------------------------------------------------------
  // Router
  // ---------------------------------------------------------------------
  function render(){
    var root = $("#app");
    root.innerHTML = "";
    var hash = location.hash || "#/home";

    if (hash === "#/review") {
      renderReview(root);
    } else if (hash.indexOf("#/month/") === 0) {
      renderMonth(root, decodeURIComponent(hash.slice("#/month/".length)));
    } else {
      renderHome(root);
    }
  }

  window.addEventListener("hashchange", render);
  render();

  // ---------------------------------------------------------------------
  // Service worker (installable PWA)
  // ---------------------------------------------------------------------
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(err){
        console.warn("Service worker registration failed", err);
      });
    });
  }
})();
</script>
</body>
